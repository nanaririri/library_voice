<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인테리어 건축 라이브러리 — 인테리어 & 외장 건축 기자재</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/css/style.css">
</head>
<body class="min-h-screen">

<!-- ===== HEADER ===== -->
<header class="sticky top-0 z-40 bg-[var(--bg)]/90 backdrop-blur border-b" style="border-color:var(--border)">
  <div class="max-w-[1400px] mx-auto px-4 md:px-8">
    <div class="flex items-center justify-between h-16 overflow-visible">
      <div class="flex items-center gap-3 cursor-pointer relative z-10" data-action="reset">
        <div class="w-24 h-24 flex items-center justify-center rounded-sm overflow-hidden shrink-0">
          <img src="https://raw.githubusercontent.com/nanaririri/ai/main/logo.png" alt="로고" class="w-full h-full object-contain" />
        </div>
        <div class="leading-none">
          <div class="font-display font-900 text-lg tracking-tight" style="color:var(--ink)">인테리어 건축 라이브러리</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button data-action="open-listmap" class="flex items-center gap-1.5 text-xs font-semibold font-mono tracking-wide px-4 py-2 rounded-full" style="background:var(--ink); color:#fff">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
          <span class="hidden sm:inline">업체 한눈에 보기</span>
        </button>
      </div>
    </div>
    <!-- breadcrumb -->
    <div id="breadcrumb" class="pb-3 text-[13px] font-medium flex items-center gap-1.5 flex-wrap"></div>
  </div>
</header>

<!-- mobile stage strip -->
<div id="rail-mobile" class="md:hidden max-w-[1400px] mx-auto px-4 pt-4"></div>

<div class="max-w-[1400px] mx-auto px-4 md:px-8 flex gap-8">
  <!-- ===== DESKTOP VERTICAL STAGE RAIL ===== -->
  <aside class="hidden md:flex flex-col items-center pt-14 shrink-0" style="width:64px">
    <div id="rail-desktop" class="flex flex-col items-center"></div>
  </aside>

  <!-- ===== MAIN STAGE ===== -->
  <main class="flex-1 min-w-0 py-8 md:py-14 pb-24">
    <div id="stage" class="stage-panel stage-in"></div>
  </main>
</div>

<!-- ===== MODAL ===== -->
<div id="modal-root" class="fixed inset-0 z-50 modal-hidden">
  <div id="modal-backdrop" class="absolute inset-0" data-action="close-modal"></div>
  <div class="relative min-h-screen flex items-end sm:items-center justify-center p-0 sm:p-6" style="pointer-events:none">
    <div id="modal-panel" class="relative w-full sm:max-w-lg bg-[var(--surface)] sm:rounded-sm rounded-t-2xl border shadow-2xl max-h-[92vh] overflow-y-auto" style="border-color:var(--border)">
      <div id="modal-body"></div>
    </div>
  </div>
</div>

<!-- ===== LISTMAP ===== -->
<div id="listmap-root" class="fixed inset-0 z-50 listmap-hidden">
  <div id="listmap-backdrop" class="absolute inset-0" data-action="close-listmap"></div>
  <div class="relative h-full flex justify-end" style="pointer-events:none">
    <div id="listmap-panel" class="relative w-full sm:max-w-2xl h-full bg-[var(--surface)] border-l shadow-2xl flex flex-col" style="border-color:var(--border)">
      <div class="shrink-0 border-b px-6 md:px-8 py-5" style="border-color:var(--border)">
        <div class="flex items-start justify-between mb-4">
          <div>
            <h2 class="font-display font-700 text-2xl tracking-tight" style="color:var(--ink)">전체 업체 리스트맵</h2>
          </div>
          <button data-action="close-listmap" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background:var(--accent-soft); color:var(--accent)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="flex items-center gap-2 rounded-full px-4 py-2.5 border" style="border-color:var(--border); background:var(--bg)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--gray); flex-shrink:0"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="listmap-filter" type="text" autocomplete="off" placeholder="업체명 또는 대표제품으로 빠르게 찾기" class="flex-1 outline-none text-sm bg-transparent" style="color:var(--ink)" />
        </div>
      </div>
      <div id="listmap-body" class="flex-1 overflow-y-auto px-6 md:px-8 py-6"></div>
    </div>
  </div>
</div>

<footer class="border-t py-8 text-center" style="border-color:var(--border)">
  <p class="font-mono text-[11px] tracking-wide" style="color:var(--gray)">MATERIAL INDEX — INTERIOR &amp; FACADE SOURCING PROTOTYPE · 예시 데이터 기반 프로토타입입니다</p>
</footer>
<script type="module" src="/src/js/main.js"></script>
</body>
</html>
